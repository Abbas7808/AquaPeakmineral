<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FA" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#01386A" />
    </linearGradient>
    <linearGradient id="dropletHighlight" x1="0%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Circle Badge -->
  <circle cx="100" cy="100" r="92" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="4"/>

  <!-- Water Drop Shadow / Outer Ring -->
  <path d="M 100 22 C 100 22, 155 95, 155 130 A 55 55 0 0 1 45 130 C 45 95, 100 22, 100 22 Z" 
        fill="url(#waterGrad)" filter="url(#softGlow)" opacity="0.3"/>

  <!-- Main Water Droplet Body -->
  <path d="M 100 25 C 100 25, 152 95, 152 128 A 52 52 0 0 1 48 128 C 48 95, 100 25, 100 25 Z" 
        fill="url(#waterGrad)"/>

  <!-- Internal Dynamic Waves -->
  <path d="M 52 135 C 70 120, 85 145, 105 132 C 125 120, 140 135, 148 130 A 52 52 0 0 1 100 180 A 52 52 0 0 1 52 135 Z" 
        fill="url(#waveGrad)" opacity="0.75"/>
  <path d="M 60 148 C 75 140, 90 152, 110 144 C 130 136, 142 146, 144 142 A 52 52 0 0 1 100 180 A 52 52 0 0 1 60 148 Z" 
        fill="#0369A1" opacity="0.5"/>

  <!-- Highlight Curves -->
  <path d="M 100 36 C 98 42, 64 96, 62 126 C 60 145, 68 160, 68 160 C 68 160, 58 142, 60 122 C 63 94, 94 44, 100 36 Z" 
        fill="url(#dropletHighlight)"/>
  <circle cx="85" cy="65" r="5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="78" cy="80" r="3" fill="#FFFFFF" opacity="0.6"/>

  <!-- "AQUA" Stylized Wordmark Inside or Under -->
  <text x="100" y="112" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AQUA</text>
  <text x="100" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#E0F2FE" text-anchor="middle" letter-spacing="2">WATER</text>
</svg>
