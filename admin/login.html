<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | Aqua Water 🌊💦 Management Portal</title>
    <link rel="icon" href="/public/images/aqua_water_logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 228, 242, 0.85);
        }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#01386A] via-[#022B52] to-[#071C33] flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Ambient Glow Orbs -->
    <div class="pointer-events-none absolute -top-40 -left-40 h-96 w-96 rounded-full bg-cyan-400/20 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-40 -right-40 h-96 w-96 rounded-full bg-blue-500/20 blur-3xl"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo and Brand Card Header -->
        <div class="text-center mb-6">
            <a href="/index.html" class="inline-flex items-center gap-3 group">
                <img src="/public/images/aqua_water_logo.svg" alt="Aqua Water Logo" class="h-14 w-14 rounded-2xl bg-white/95 p-1.5 shadow-xl border border-white/30 transition duration-300 group-hover:scale-105">
                <div class="text-left">
                    <p class="text-xs font-bold tracking-[0.25em] text-cyan-300 uppercase">Aqua Water 🌊💦</p>
                    <p class="text-xl font-black text-white font-heading">Operations Portal</p>
                </div>
            </a>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-[2.2rem] p-8 shadow-[0_28px_60px_-20px_rgba(0,0,0,0.5)]">
            <div class="border-b border-slate-100 pb-4 mb-6 text-center">
                <h1 class="text-2xl font-black text-[#071C33] font-heading">Admin Sign In</h1>
                <p class="text-xs text-slate-500 mt-1">Manage bottle orders, routes, products & customer inquiries</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-rose-500"></i>
                <span id="error-message">Invalid username or password.</span>
            </div>

            <!-- Form -->
            <form id="admin-login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-user-shield text-xs"></i>
                        </span>
                        <input type="text" id="username" required value="admin" class="w-full rounded-xl border border-slate-200 bg-slate-50/80 py-2.5 pl-10 pr-4 text-sm text-slate-800 placeholder-slate-400 focus:border-[#01386A] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#01386A]/10 transition" placeholder="Enter username">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                        <span class="text-[11px] font-semibold text-cyan-700">Protected Area</span>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="password" required value="admin123" class="w-full rounded-xl border border-slate-200 bg-slate-50/80 py-2.5 pl-10 pr-10 text-sm text-slate-800 placeholder-slate-400 focus:border-[#01386A] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#01386A]/10 transition" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600">
                            <i id="toggle-pwd-icon" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Default Credentials Badge -->
                <div class="rounded-xl bg-cyan-50/90 border border-cyan-100 p-3 text-xs text-cyan-900 flex items-start gap-2.5">
                    <i class="fa-solid fa-key text-cyan-600 mt-0.5"></i>
                    <div>
                        <p class="font-bold">Default Admin Credentials:</p>
                        <p class="mt-0.5 text-slate-600">Username: <span class="font-mono font-bold text-cyan-800">admin</span> | Password: <span class="font-mono font-bold text-cyan-800">admin123</span></p>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full rounded-xl bg-gradient-to-r from-[#01386A] to-[#0284C7] py-3 text-sm font-bold text-white shadow-lg shadow-cyan-900/20 hover:from-[#002f5a] hover:to-[#0275b1] transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
                    <span>Access Dashboard</span>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                <a href="/index.html" class="hover:text-[#01386A] inline-flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Website
                </a>
                <span class="text-slate-400 font-mono text-[11px]">Aqua OS v2.4</span>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggle-pwd-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errBanner = document.getElementById('error-banner');
            const errMsg = document.getElementById('error-message');
            errBanner.classList.add('hidden');

            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-xs"></i><span>Authenticating...</span>';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    localStorage.setItem('aqua_admin_token', data.token);
                    localStorage.setItem('aqua_admin_user', JSON.stringify(data.user));
                    window.location.href = '/admin/index.html';
                } else {
                    errBanner.classList.remove('hidden');
                    errMsg.textContent = data.message || 'Invalid username or password.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket text-xs"></i><span>Access Dashboard</span>';
                }
            } catch (err) {
                console.error(err);
                // Fallback check if server offline or static check
                if (u === 'admin' && p === 'admin123') {
                    const fallbackToken = 'aqw_token_' + Date.now();
                    localStorage.setItem('aqua_admin_token', fallbackToken);
                    localStorage.setItem('aqua_admin_user', JSON.stringify({ username: 'admin', role: 'Super Admin', name: 'Aqua Water Manager' }));
                    window.location.href = '/admin/index.html';
                } else {
                    errBanner.classList.remove('hidden');
                    errMsg.textContent = 'Server connection failed or invalid credentials.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket text-xs"></i><span>Access Dashboard</span>';
                }
            }
        }

        // Auto-redirect if already authenticated
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('aqua_admin_token');
            if (token) {
                try {
                    const res = await fetch('/api/admin/check', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const d = await res.json();
                    if (d.authenticated) {
                        window.location.href = '/admin/index.html';
                    }
                } catch (e) {}
            }
        });
    </script>
</body>
</html>
